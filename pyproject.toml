[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "papertrail-agent"
version = "0.1.0"
description = "A local-first research paper workbench with grounded retrieval and Qwen generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pypdf>=6.1,<7",
  "python-multipart>=0.0.20,<1", "httpx>=0.28,<1", "pydantic-settings>=2.8,<3",
  "rank-bm25==0.2.2", "numpy>=2,<3"
]

[project.optional-dependencies]
local = ["torch==2.6.0", "transformers==4.51.3", "accelerate==1.6.0"]
dev = ["pytest==8.3.5", "ruff==0.11.5"]

[project.scripts]
papertrail = "paper_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
paper_agent = ["static/*", "fixtures/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100

